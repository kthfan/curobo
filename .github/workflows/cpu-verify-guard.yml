# Blocks the CPU-only verification harness from reaching main.
# The harness (cpu_verify/, cpu-verify.yml) lives only on verification branches; see
# cpu_verify/README.md. This workflow travels with the harness, so any pull request that
# carries the harness into main also carries this check and fails.
name: cpu-verify guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  no-cpu-verify-on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject CPU verification files
        run: |
          found=0
          if [ -e cpu_verify ]; then
            echo "::error::cpu_verify/ must not be merged into main (CPU-only verification harness)."
            found=1
          fi
          if [ -e .github/workflows/cpu-verify.yml ]; then
            echo "::error::.github/workflows/cpu-verify.yml must not be merged into main."
            found=1
          fi
          # Catch harness code copied into the library.
          if grep -rIl "cpu_verify/README.md" curobo; then
            echo "::error::Files above carry the cpu_verify 'NOT for main' marker."
            found=1
          fi
          exit $found
